name: Podcast Digest

on:
  push:
    paths:
      - 'podcast-digest/**'
      - '.github/workflows/podcast-digest.yml'
  pull_request:
    paths:
      - 'podcast-digest/**'
      - '.github/workflows/podcast-digest.yml'
  # Weekly digest: Sunday morning, covering the previous seven days.
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: 'Week ending (YYYY-MM-DD); blank = today'
        required: false

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: podcast-digest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit + end-to-end tests (Claude stubbed)
        run: python -m unittest discover -s tests -v

  build:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # commit feed/data and create the audio release
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Add an ANTHROPIC_API_KEY repository secret to enable the weekly podcast digest."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: '3.12'
      - name: Install ffmpeg + Python deps (with local Whisper)
        if: steps.key.outputs.ok == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          pip install -r podcast-digest/requirements.txt faster-whisper
      - name: Cache transcripts, analyses and Whisper models
        if: steps.key.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: |
            podcast-digest/.cache
            ~/.cache/huggingface
          key: podcast-digest-${{ github.run_id }}
          restore-keys: podcast-digest-
      - name: Build this week's digest
        if: steps.key.outputs.ok == 'true'
        id: build
        working-directory: podcast-digest
        run: |
          DATE="${{ github.event.inputs.date }}"
          DATE="${DATE:-$(date -u +%F)}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          python -m digest build --date "$DATE"
          # Keep the cache small: drop downloaded episode audio, keep transcripts.
          find .cache -name 'episode.*' -delete; rm -rf .cache/_render
      - name: Upload audio as a release asset and publish the feed
        if: steps.key.outputs.ok == 'true' && hashFiles(format('podcast-digest/episodes/{0}.mp3', steps.build.outputs.date)) != ''
        working-directory: podcast-digest
        run: |
          DATE="${{ steps.build.outputs.date }}"
          TAG="podcast-digest-$DATE"
          cp "episodes/$DATE.mp3" "$TAG.mp3"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$TAG.mp3" --title "Podcast Digest — week ending $DATE" \
            --notes "Weekly digest audio. Feed: https://kstenson.github.io/claude-experiments/podcast-digest/feed.xml"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json feed.xml chapters/
          git commit -m "podcast-digest: week ending $DATE"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
